<!DOCTYPE html>
<html>
<head>
<style>
    p {
        color: black;
    }

    .biru {
        background-color: lightblue;
    }

    .hijau {
        background-color: lightgreen;
    }

    .merah {
        background-color: lightcoral;
    }

    #judul {
        font-size: 32px;
        color: navy;
        text-align: center;
    }
</style>
</head>

<body>

<h1 id="judul">Latihan CSS Selector</h1>

<p>Perkenalkan Saya Ainun Zaila.</p>

<p class="biru">Saya seorang Mahasiswa.</p>

<p class="hijau">Di Sekolah Tinggi Teknologi Bontang.</p>

<p class="merah">Prodi Teknik Informatika.</p>

</body>
</html>
