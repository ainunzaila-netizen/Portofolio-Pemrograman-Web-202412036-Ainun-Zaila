<!DOCTYPE html>
<html>
<head>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 100px 100px;
            gap: 15px;
            padding: 15px;
        }

        .item1 {
            background-color: #85bd2a;
            grid-column: span 2; /* Menempati 2 kolom */
        }

        .item2 {
            background-color: #00f9e8;
        }

        .item3 {
            background-color: #16d4ff;
        }

        .item4 {
            background-color: #f7df43;
        }

        .item5 {
            background-color: #ff3737;
        }

        .item6 {
            background-color: #fd79a8;
        }

        .grid-item {
            color: white;
            text-align: center;
            font-size: 20px;
            padding-top: 35px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="grid-container">
    <div class="grid-item item1">Ainun</div>
    <div class="grid-item item2">Zaila</div>
    <div class="grid-item item3">seorang</div>
    <div class="grid-item item4">mahasiswa</div>
    <div class="grid-item item5">STITEK</div>
    <div class="grid-item item6">Bontang</div>
</div>

</body>
</html>
