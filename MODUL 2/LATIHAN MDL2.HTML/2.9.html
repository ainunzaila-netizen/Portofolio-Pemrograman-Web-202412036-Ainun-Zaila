<!DOCTYPE html>
<html>
<head>
    <title>Responsive Grid Layout</title>
    <style>
        /* Tampilan Desktop */
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 36px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .grid-item {
            background-color: #2196F3;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 20px;
            border-radius: 8px;
        }

        /* Tampilan Smartphone */
        @media only screen and (max-width: 600px) {
            body {
                background-color: lightcoral;
            }

            h1 {
                font-size: 24px;
            }

            .grid-container {
                grid-template-columns: 1fr;
            }

            .grid-item {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <h1>Mahasiswa STITEK Bontang</h1>

    <div class="grid-container">
        <div class="grid-item">Ainun</div>
        <div class="grid-item">Zaila</div>
        <div class="grid-item">seorang</div>
        <div class="grid-item">Mahasiswa</div>
        <div class="grid-item">STITEK</div>
        <div class="grid-item">Bontang</div>
    </div>

</body>
</html>
