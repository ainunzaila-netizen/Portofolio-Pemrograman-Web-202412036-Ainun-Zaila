<!DOCTYPE html>
<html lang="en">
<head>
    <title>Card Bootstrap Profil Mahasiswa</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container mt-4">
    <h2 class="text-center mb-4">Profil Mahasiswa</h2>

    <!-- Card dengan gambar di atas -->
    <div class="card mx-auto" style="width:400px">
        <img class="card-img-top" src="ainun1.jpeg" alt="Foto Saya" style="width:100%">

        <div class="card-body">
            <h4 class="card-title">Ainun</h4>
            <p class="card-text">
                Mahasiswa Teknik Informatika yang sedang mempelajari Bootstrap dan pengembangan web.
            </p>
            <a href="#" class="btn btn-primary">Lihat Profil</a>
        </div>
    </div>

    <br><br>

    <!-- Card dengan gambar di bawah -->
    <div class="card mx-auto" style="width:400px">
        <div class="card-body">
            <h4 class="card-title">Ainun</h4>
            <p class="card-text">
                Contoh card kedua dengan posisi gambar berada di bagian bawah card.
            </p>
            <a href="#" class="btn btn-success">Detail</a>
        </div>

        <img class="card-img-bottom" src="ainun2.jpeg" alt="Foto Saya" style="width:100%">
    </div>
</div>

</body>
</html>
