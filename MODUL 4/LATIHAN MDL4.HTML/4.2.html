<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Latihan Event Handling</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        #gambar{
            border: 3px solid gray;
            border-radius: 10px;
        }

        #inputNama{
            border: 2px solid #ccc;
            padding: 8px;
            transition: border-color 0.3s;
        }

        #inputNama:focus{
            border-color: dodgerblue;
        }

        #hasil{
            color: crimson;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h3>Event onmouseover & onmouseout</h3>

    <img id="gambar"
         src="https://placehold.co/200x150/e8e8e8/000?text=Gambar+Awal"
         alt="Gambar"
         onmouseover="gantiGambar()"
         onmouseout="kembalikanGambar()">

    <hr>

    <h3>Event onfocus & onchange</h3>

    <label for="inputNama">Ketik Nama Anda:</label><br><br>

    <input type="text"
           id="inputNama"
           placeholder="Masukkan nama..."
           onfocus="fokusInput()"
           onchange="tampilkanOutput()">

    <p>Output: <span id="hasil"></span></p>

<script>

function gantiGambar(){
    document.getElementById("gambar").src =
    "https://placehold.co/200x150/3498db/fff?text=Gambar+Kedua";
}

function kembalikanGambar(){
    document.getElementById("gambar").src =
    "https://placehold.co/200x150/e8e8e8/000?text=Gambar+Awal";
}

function fokusInput(){
    document.getElementById("hasil").innerHTML =
    "Silakan ketik nama Anda...";
}

function tampilkanOutput(){
    var nilaiInput = document.getElementById("inputNama").value;

    document.getElementById("hasil").innerHTML =
    "<b>Halo, " + nilaiInput + "!</b>";
}

</script>

</body>
</html>
