<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        input{
            padding: 8px;
            width: 250px;
        }

        button{
            padding: 8px 12px;
            cursor: pointer;
            margin-left: 5px;
        }

        ul{
            margin-top: 20px;
        }

        li{
            margin-bottom: 10px;
        }

        .hapus{
            background-color: crimson;
            color: white;
            border: none;
            padding: 5px 10px;
            margin-left: 10px;
            cursor: pointer;
        }

        .hapus:hover{
            background-color: darkred;
        }
    </style>
</head>

<body>

<h2>To-Do List Sederhana</h2>

<input type="text" id="input-todo" placeholder="Ketik tugas baru...">

<button onclick="tambahTugas()">Tambah</button>

<ul id="daftar-tugas"></ul>

<script>

var tugas = [];

function tambahTugas(){

    var inputElement = document.getElementById("input-todo");

    if(inputElement.value.trim() == ""){
        alert("Tugas tidak boleh kosong!");
        return;
    }

    tugas.push(inputElement.value);

    inputElement.value = "";

    tampilkanDaftar();

}

function tampilkanDaftar(){

    var daftarElement = document.getElementById("daftar-tugas");

    daftarElement.innerHTML = "";

    for(let i = 0; i < tugas.length; i++){

        daftarElement.innerHTML +=
        "<li>" +
        tugas[i] +
        " <button class='hapus' onclick='hapusTugas(" + i + ")'>Hapus</button>" +
        "</li>";

    }

}

function hapusTugas(index){

    tugas.splice(index, 1);

    tampilkanDaftar();

}

</script>

</body>
</html>
